<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="content">
      <section>
        <label class="section-title" for="new-task">Add Item</label>
        <div class="add-task__row">
          <input id="new-task" class="task input-text input-text_add" type="text">
          <button class="btn">Add</button>
        </div>
      </section>
      <section>
        <h2>Todo</h2>
        <ul id="incompleteTasks">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task task-item__label">Pay Bills</label>
            <input type="text" class="task input-text task-item__input">
            <button class="btn btn_edit">Edit</button>
            <button class="btn btn_delete">
              <img src="./remove.svg" alt="remove">
            </button>
          </li>
          <li class="task-item task-item_editing">
            <input class="task-item__checkbox" type="checkbox">
            <label class="task task-item__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task input-text task-item__input">
            <button class="btn btn_edit">Save</button>
            <button class="btn btn_delete">
              <img src="./remove.svg" alt="remove">
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul class="task-list task-list_completed" id="completed-tasks">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" checked>
            <label class="task task-item__label">See the Doctor</label>
            <input type="text" class="task input-text task-item__input">
            <button class="btn btn_edit">Edit</button>
            <button class="btn btn_delete">
              <img src="./remove.svg" alt="remove">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
